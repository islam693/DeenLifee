name: Build DeenLife APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip DeenLife-Source.zip -d .

      - name: Check extracted files
        run: ls -la

      - name: Make gradlew executable
        working-directory: DeenLife
        run: chmod +x gradlew

      - name: Build APK
        working-directory: DeenLife
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeenLife-APK
          path: DeenLife/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

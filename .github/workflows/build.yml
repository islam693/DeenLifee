name: Build DeenLife APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Extract project
        run: unzip DeenLife-Source.zip -d .

      - name: Find gradlew wrapper
        id: find_gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::gradlew not found in archive"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW_PATH")
          echo "project_dir=$DIR" >> $GITHUB_OUTPUT
          echo "gradlew=$GRADLEW_PATH" >> $GITHUB_OUTPUT

      - name: Make gradlew executable
        run: chmod +x ${{ steps.find_gradle.outputs.gradlew }}

      - name: Build APK
        working-directory: ${{ steps.find_gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeenLife-APK
          path: ${{ steps.find_gradle.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

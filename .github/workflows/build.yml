name: Build DeenLife APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Extract project
        run: unzip DeenLife-Source.zip -d .

      - name: Find project directory
        id: find_project
        run: |
          if [ -d "DeenLife" ]; then
            echo "dir=DeenLife" >> $GITHUB_OUTPUT
          elif [ -d "DeenLife-Source" ]; then
            echo "dir=DeenLife-Source" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Make gradlew executable
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeenLife-APK
          path: ${{ steps.find_project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
